   crossorigin=""/>
 <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"

<body>
<h1>Hier Überschrift </h1>
<p>This is a <b> paragraph <b> of text with a link <a href="http://www.uni-teubingen.de">hyperlink</a>.</p>
<div id="mapid" style="width: 600px; height: 400px; position: relative;"></div>
<div id="mapid2" style="width: 600px; height: 400px; position: relative;"></div>

<script>

var mymap = L.map('mapid').setView([48.52395, 9.05525]).setZoom(18);
	L.tileLayer('https://{s}.tile.openstreetmap.de/tiles/osmde/{z}/{x}/{y}.png').addTo(mymap);

var mymap2 = L.map('mapid2').setView([48.52395, 9.05525]).setZoom(18);
	L.tileLayer('https://{s}.tile.thunderforest.com/pioneer/{z}/{x}/{y}{r}.png?apikey={apikey}', {
	attribution: '&copy; <a href="http://www.thunderforest.com/">Thunderforest</a>, &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
	apikey: '<your apikey>',
	maxZoom: 22}.addTo(mymap2);
	
</script>



</body>
</html>
